<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Greetings</title>
        <link rel="stylesheet" href="../../assets/css/style.css" />
        <link rel="icon" type="image/x-icon" href="../../img/logo.ico">
        <script src="../../assets/js/main.js" defer type="module"></script>
        <script src="../../assets/js/notifaction/sender.js" defer type="module"></script>
    </head>
    <body>
        <div class="flex greetings-container">
            <div class="greetings flex">
                <aside class="flex padding-medium ">
                    <img src="./../../img/logo.ico" class="neumorphism-small radius-small padding-medium" alt="Logo">
                </aside>
                <section class="padding-medium ">
                    <h2 class="text-gradient">Greetings! Let's Connect!</h2>
                    <form class="flex" id="form" method="post">
                        <input type="hidden" name="access_key" value="a24f88ad-3adb-4e83-9b79-14802c8c4fad">
                        <label>
                            <p>What is your name?</p>
                            <input type="text" name="name" id="name" placeholder="Enter your name" required maxLength="30" minlength="3" autocomplete="off"/>
                            <small class="error-text" id="errorName"></small>
                        </label>
                        <div class="gate">
                            <input type="text" id="honeypot" name="website" tabindex="-1" autocomplete="off">
                        </div>
                        <label>
                            <p>What is your purpose? <span class="text-caption error-text" id="errorPurpose"></span></p>
                            <select name="purpose" id="purpose" required>
                                <option value="" disabled selected hidden>Select your purpose</option>
                                <option value="General inquiry">General inquiry</option>
                                <option value="I want to work together">I want to work together</option>
                                <option value="Just reviewing your work">Just reviewing your work</option>
                                <option value="Freelance or contract project">Freelance or contract project</option>
                                <option value="I'm just exploring">I'm just exploring</option>
                            </select>
                        </label>
                        <div class="h-captcha" data-captcha="true" data-sitekey="50b2fe65-b00b-4b9e-ad62-3ba471098be2"></div>
                        <button type="submit" id="submit" class="neumorphism-button image-hover padding-extra-small-block padding-medium-inline radius-full"><i class="icon fa fa-handshake-o"></i><span id="submitText">Connect</span></button>
                    </form>
                    <script src="https://web3forms.com/client/script.js" async defer></script>
                </section>
            </div>
        </div>
    </body>
</html>
